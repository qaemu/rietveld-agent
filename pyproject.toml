[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rietveld-agent"
version = "0.1.0"
description = "Reproducible laboratory-scale Rietveld quantitative phase analysis (RQPA), demonstrated on NIST SRM 2686a"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "qaemu", email = "qaemu@users.noreply.github.com" }]
keywords = [
    "x-ray-diffraction", "rietveld", "quantitative-phase-analysis",
    "cement-clinker", "reproducible-research", "gsas-ii",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# GSAS-II is a pinned local dependency: see data/structures and the
# ensure_gsasii() bootstrap in benchmarks/eval/sim.py (vendored under
# .vendor/, not installed from PyPI).
plots = ["matplotlib>=3.7"]
eval = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/qaemu/rietveld-agent"
Documentation = "https://github.com/qaemu/rietveld-agent/tree/main/docs"

[tool.setuptools]
packages = []
