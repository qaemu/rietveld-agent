[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rietveld-agent"
version = "0.2.0"
description = "Deterministic Rietveld quantitative phase analysis (RQPA), demonstrated on NIST SRM 2686a cement clinker"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "qaemu", email = "qaemu@users.noreply.github.com" }]
keywords = [
    "x-ray-diffraction", "rietveld", "quantitative-phase-analysis",
    "cement-clinker", "reproducible-research", "gsas-ii",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
# GSAS-II is a pinned local dependency: see the ensure_gsasii() bootstrap
# in benchmarks/eval/sim.py (vendored under .vendor/, not on PyPI).
plots = ["matplotlib>=3.7"]
dev = ["matplotlib>=3.7", "pytest>=7"]

[project.scripts]
rietveld-agent = "cli.__main__:main"

[project.urls]
Homepage = "https://github.com/qaemu/rietveld-agent-units"
Documentation = "https://github.com/qaemu/rietveld-agent-units/blob/main/docs/index.md"

[tool.setuptools.packages.find]
include = ["core*", "cli*", "benchmarks*"]